<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>로드러너 · LODE RUNNER</title>
<meta name="theme-color" content="#0a0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="로드러너">
<style>
  /* 버튼을 누르거나 끌 때 글자·주변이 선택돼 파랗게 덮이는 것(모바일)을 막는다.
     사파리·구형 크롬은 -webkit- 접두사가 없으면 무시한다 */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{background:#0a0c14;color:#cfd6e6;font-family:"Menlo",-apple-system,"Apple SD Gothic Neo",sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:10px;gap:8px;
       overscroll-behavior:none;touch-action:manipulation}
  h1{font-size:15px;letter-spacing:.35em;color:#7f8db0;font-weight:600}
  h1 b{color:#ffd23f}
  #hud{display:flex;gap:14px;font-size:13px;letter-spacing:.05em;flex-wrap:wrap;justify-content:center}
  #hud span{color:#6b7899}
  #hud i{font-style:normal;color:#e9eefb}
  #hud .ver{color:#39445e;font-size:11px;align-self:center}
  #wrap{position:relative;width:100%;max-width:760px}
  canvas{width:100%;display:block;background:#0d1018;border:1px solid #1e2740;border-radius:6px}
  #msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
       background:rgba(6,8,14,.82);border-radius:6px;text-align:center;gap:10px;padding:16px}
  #msg h2{font-size:22px;letter-spacing:.2em;color:#ffd23f}
  #msg p{font-size:13px;color:#9aa7c4;line-height:1.7}
  .help{font-size:12px;color:#5d6884;line-height:1.8;text-align:center;max-width:640px}
  .help b{color:#93a1c4;font-weight:600}

  /* 조작 버튼. 투명 테두리(border 5px)가 히트 영역을 보이는 것보다 사방 5px 넓혀
     버튼 사이·가장자리 데드존을 없앤다. 하단은 safe-area + 14px 들어올려
     iOS 홈바·브라우저 제스처 영역과 겹치지 않게 한다 */
  #pad{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;
       justify-content:space-between;align-items:flex-end;pointer-events:none;touch-action:none;
       padding:0 max(6px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom,0px) + 14px) max(6px,env(safe-area-inset-right))}
  #pad .cluster{display:grid;gap:0;pointer-events:auto}
  #pad .nav{grid-template-columns:repeat(3,clamp(58px,19vw,76px))}
  #pad .dg{grid-template-columns:repeat(2,clamp(68px,22vw,98px))}
  #pad button{background:rgba(21,27,44,.82);background-clip:padding-box;
              border:5px solid transparent;box-shadow:inset 0 0 0 1px #2c3757;
              color:#cfd6e6;border-radius:14px;height:66px;font-size:20px;font-family:inherit;
              user-select:none;touch-action:none}
  #pad button.on,#pad button:active{background:#31406a;background-clip:padding-box;color:#ffd23f}
  #pad button:focus{outline:none}          /* 눌린 뒤 테두리가 남지 않게 */
  #pad .dig{color:#ff8f5a;font-size:14px;font-weight:600}
  /* 다이아몬드 배열: ▲ 위 / ◀ ▶ 가운데 / ▼ 맨 아래 한가운데 */
  #pad .u{grid-column:2;grid-row:1} #pad .l{grid-column:1;grid-row:2}
  #pad .r{grid-column:3;grid-row:2} #pad .d{grid-column:2;grid-row:3}

  .rot{display:none}
  @media(pointer:coarse){
    #pad{display:flex}
    .help .kb{display:none}
    body{padding-bottom:235px}   /* 3줄 다이아몬드 패드 높이만큼 */
  }
  @media(pointer:coarse) and (orientation:portrait){
    .rot{display:block;color:#ffd23f;margin-bottom:6px}
  }
  /* 가로로 눕힌 폰(과 낮은 창): 게임판 좌우에 버튼 자리를 예약해 화면을 가리지 않고,
     버튼은 좌우 여백의 세로 중앙(엄지 높이)에 둔다 */
  @media (orientation:landscape) and (max-height:560px){
    body{padding:0;gap:0;justify-content:flex-start}
    h1,.help{display:none}
    #hud{padding:3px 0;font-size:12px;gap:12px}
    #wrap{max-width:none;display:flex;justify-content:center;align-items:center;height:calc(100dvh - 28px)}
    canvas{width:min(100vw - 280px, (100dvh - 40px)*1.75);height:auto;border:0;border-radius:4px}
    #pad{top:28px;bottom:0;align-items:center;
         padding:0 max(4px,env(safe-area-inset-right)) 0 max(4px,env(safe-area-inset-left))}
    #pad button{height:56px;background:rgba(21,27,44,.6);background-clip:padding-box}
    #pad .nav{grid-template-columns:repeat(3,46px)}
    #pad .dg{grid-template-columns:repeat(2,62px)}
  }
</style>
</head>
<body>
<h1>로드러너 <b>LODE RUNNER</b></h1>
<div id="hud">
  <span>SCORE <i id="sc">0</i></span>
  <span>LEVEL <i id="lv">1</i></span>
  <span>GOLD <i id="gd">0</i></span>
  <span>LIVES <i id="li">3</i></span>
  <span class="ver" id="vr"></span>
</div>
<div id="wrap">
  <canvas id="cv" width="672" height="384"></canvas>
  <div id="msg"><h2 id="mt"></h2><p id="mp"></p></div>
</div>
<div id="pad">
  <div class="cluster nav">
    <button data-k="u" class="u">▲</button>
    <button data-k="l" class="l">◀</button>
    <button data-k="d" class="d">▼</button>
    <button data-k="r" class="r">▶</button>
  </div>
  <div class="cluster dg">
    <button data-k="dl" class="dig">◤ 파기</button>
    <button data-k="dr" class="dig">파기 ◥</button>
  </div>
</div>
<p class="help">
  <span class="rot">📱 폰을 가로로 눕히면 화면 가득 크게 나옵니다</span>
  <span class="kb"><b>이동</b> 방향키 / WASD &nbsp;·&nbsp; <b>왼쪽 파기</b> Z &nbsp;·&nbsp; <b>오른쪽 파기</b> X &nbsp;·&nbsp; <b>재시작</b> R<br></span>
  금괴를 모두 줍고 나타나는 사다리를 타고 맨 위로 탈출. 벽돌을 파서 적을 가두거나 아래로 내려간다.
</p>

<script>
const APP_VER = "2026-08-13.10";     // 배포할 때마다 올린다 — 자동 새로고침의 기준값
const W = 28, H = 16, TS = 24;
const SPD = 0.115, FALL = 0.22, ESPD = 0.058, GRACE = 120; // 적은 느리게, 시작 2초 유예
const REGEN = 280, TRAP = 150, DIGLOCK = 14;   // 구멍 4.7초 유지 / 적은 2.5초 뒤 기어나옴

const LEVELS = [
[
"............................",
"S..........................S",
"S.$......H.........$.......S",
"S########H#################S",
"S........H............H...$S",
"S........H############H####S",
"S....----H---------...H....S",
"S.....$..H......$.....H....S",
"S########H############H####S",
"S....X...H..........X.H....S",
"S..$.....H........H...H.$..S",
"S########H########H########S",
"S........H........H........S",
"S...$....H........H...$....S",
"S........H...&....H........S",
"@@@@@@@@@@@@@@@@@@@@@@@@@@@@"
],
[
"............................",
"S..........................S",
"S.........................$S",
"S##########################S",
"S....$.......H.......$.....S",
"S############H#############S",
"S...X........H.........X...S",
"S------......H......-------S",
"S..$.........H........$....S",
"S############H#############S",
"S........$...H...$.........S",
"S############H#############S",
"S...$........H.......$.....S",
"S............H.............S",
"S..........&.H.............S",
"@@@@@@@@@@@@@@@@@@@@@@@@@@@@"
],
[
"............................",
"S..........................S",
"S$........................$S",
"S###H##################H###S",
"S...H..................H...S",
"S...H.....X......X.....H...S",
"S...H...------------...H...S",
"S...H.......$$.........H...S",
"S###H#####........#####H###S",
"S...H..................H...S",
"S...H..$......$......$.H...S",
"S###H##################H###S",
"S...H..................H...S",
"S...H....$.......$.....H...S",
"S...H........&.........H...S",
"@@@@@@@@@@@@@@@@@@@@@@@@@@@@"
]
];

// --- 자체 점검: 레벨 데이터가 깨지면 바로 알려준다 ---
function validateLevels(){
  LEVELS.forEach((lv,i)=>{
    console.assert(lv.length===H, `레벨 ${i+1}: 행 수 ${lv.length} (기대 ${H})`);
    lv.forEach((row,y)=>console.assert(row.length===W, `레벨 ${i+1} 행 ${y}: 길이 ${row.length} (기대 ${W})`));
    const flat = lv.join("");
    console.assert((flat.match(/&/g)||[]).length===1, `레벨 ${i+1}: 시작 위치 없음/중복`);
    console.assert((flat.match(/\$/g)||[]).length>0, `레벨 ${i+1}: 금괴 없음`);
  });
}
validateLevels();

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let grid, holes, player, enemies, goldLeft, escapeOpen, level=0, lives=3, score=0, state="play", flash=0, grace=0;

const mk = (x,y)=>({x, y, tx:x, ty:y, dir:1, fall:false, hole:0, lock:0, anim:0});

function loadLevel(n){
  level = ((n % LEVELS.length) + LEVELS.length) % LEVELS.length;
  grid = LEVELS[level].map(r=>r.split(""));
  holes = []; enemies = []; goldLeft = 0; escapeOpen = false; flash = 0; grace = GRACE;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c = grid[y][x];
    if(c==="&"){ player = mk(x,y); grid[y][x]="."; }
    else if(c==="X"){ enemies.push(mk(x,y)); grid[y][x]="."; }
    else if(c==="$") goldLeft++;
  }
  updHud();
}

function tile(x,y){
  if(x<0||x>=W||y<0||y>=H) return "@";
  const c = grid[y][x];
  if(c==="S") return escapeOpen ? "H" : ".";
  if(c==="$") return ".";
  return c;
}
const free = (x,y)=>{ const t=tile(x,y); return t!=="#" && t!=="@"; };
const holeAt = (x,y)=>holes.find(h=>h.x===x&&h.y===y);
const enemyAt = (x,y,not)=>enemies.find(e=>e!==not && Math.round(e.x)===x && Math.round(e.y)===y);

function supported(x,y,self){
  const c = tile(x,y);
  if(c==="H"||c==="-") return true;
  const b = tile(x,y+1);
  if(b==="#"||b==="@"||b==="H") return true;
  return !!enemyAt(x,y+1,self);
}

// --- 이동: 목표 칸으로 보간, 칸에 도착하면 다시 결정 ---
function advance(e, speed, decide){
  let budget = 1, guard = 0;
  while(budget > 1e-6 && guard++ < 6){
    if(e.x===e.tx && e.y===e.ty){
      decide(e);
      if(e.x===e.tx && e.y===e.ty) break;
    }
    const dx = e.tx-e.x, dy = e.ty-e.y, d = Math.hypot(dx,dy);
    const v = e.fall ? FALL : speed;
    const t = Math.min(budget, d/v);
    e.x += dx/d*v*t; e.y += dy/d*v*t; budget -= t;
    if(Math.abs(e.x-e.tx)<1e-6 && Math.abs(e.y-e.ty)<1e-6){ e.x=e.tx; e.y=e.ty; }
  }
}

const keys = {};
const buf = {};                                   // 짧게 눌러도 한 칸은 움직이도록 버퍼
const press = k=>{ keys[k]=true; buf[k]=12; };   // 짧은 탭도 한 칸은 확실히 먹게
const held = k=>keys[k] || buf[k] > 0;
function decayBuf(){ for(const k in buf) if(buf[k]>0) buf[k]--; }

function playerDecide(p){
  const x = p.x, y = p.y, c = tile(x,y);
  p.fall = false;
  if(p.lock > 0){ p.lock--; return; }
  if(!supported(x,y,p) && free(x,y+1)){ p.tx=x; p.ty=y+1; p.fall=true; return; }
  if(held("up") && c==="H" && free(x,y-1)){ p.tx=x; p.ty=y-1; p.anim++; buf.up=0; return; }
  if(held("down") && free(x,y+1)){ p.tx=x; p.ty=y+1; p.anim++; buf.down=0; return; }
  if(held("left") && free(x-1,y)){ p.tx=x-1; p.dir=-1; p.anim++; buf.left=0; return; }
  if(held("right") && free(x+1,y)){ p.tx=x+1; p.dir=1; p.anim++; buf.right=0; return; }
}

function dig(side){
  const p = player;
  if(p.x!==p.tx || p.y!==p.ty || p.lock>0) return;
  const x = Math.round(p.x), y = Math.round(p.y);
  const b = tile(x,y+1);
  if(b!=="#" && b!=="@") return;              // 발판 위에서만
  const bx = x + side;
  if(grid[y+1] === undefined || grid[y+1][bx] !== "#") return;   // 팔 수 있는 벽돌만
  if(!free(bx,y)) return;                      // 벽돌 위가 막혀 있으면 못 판다
  grid[y+1][bx] = ".";
  holes.push({x:bx, y:y+1, t:0});
  p.dir = side; p.lock = DIGLOCK;
}

// --- 적 AI: 플레이어까지 BFS 한 걸음 ---
const prev = new Int16Array(W*H);
function neighbors(x,y,out){
  out.length = 0;
  const c = tile(x,y), b = tile(x,y+1);
  if(c==="H"||c==="-"||b==="#"||b==="@"||b==="H"){
    if(free(x-1,y)) out.push([x-1,y]);
    if(free(x+1,y)) out.push([x+1,y]);
  }
  if(c==="H" && free(x,y-1)) out.push([x,y-1]);
  if(free(x,y+1)) out.push([x,y+1]);
  return out;
}
function bfsStep(sx,sy,gx,gy){
  prev.fill(-1);
  const q = [sy*W+sx]; prev[sy*W+sx] = sy*W+sx;
  const nb = [];
  for(let i=0;i<q.length;i++){
    const cur = q[i], cx = cur%W, cy = (cur/W)|0;
    if(cx===gx && cy===gy){
      let n = cur;
      while(prev[n] !== sy*W+sx && prev[n] !== n) n = prev[n];
      return [n%W, (n/W)|0];
    }
    neighbors(cx,cy,nb);
    for(const [nx,ny] of nb){
      const id = ny*W+nx;
      if(prev[id] === -1){ prev[id] = cur; q.push(id); }
    }
  }
  return null;
}

function enemyDecide(e){
  const x = e.x, y = e.y;
  e.fall = false;
  const h = holeAt(x,y);
  if(h){                                       // 구멍에 빠짐
    if(e.hole === 0) e.hole = TRAP;
    e.hole--;
    if(e.hole <= 0){
      const want = Math.sign(player.x - x) || 1;
      for(const s of [want, -want]){
        if(!free(x+s,y) && free(x+s,y-1)){ e.tx=x+s; e.ty=y-1; e.hole=0; return; }
      }
      e.hole = 20;
    }
    return;
  }
  e.hole = 0;
  if(!supported(x,y,e) && free(x,y+1)){ e.tx=x; e.ty=y+1; e.fall=true; return; }
  const step = bfsStep(x, y, Math.round(player.x), Math.round(player.y));
  if(!step) return;
  const [nx,ny] = step;
  if(enemyAt(nx,ny,e)) return;                 // 겹치지 않게 대기
  e.tx = nx; e.ty = ny; e.anim++;
  if(nx !== x) e.dir = Math.sign(nx-x);
}

function spawnEnemy(){
  for(let i=0;i<80;i++){
    const x = 1 + ((Math.random()*(W-2))|0), y = 1 + ((Math.random()*3)|0);
    if(free(x,y) && !enemyAt(x,y) && Math.abs(x-player.x)>4) return mk(x,y);
  }
  return mk(1,1);
}

function die(){
  if(state !== "play") return;
  lives--;
  if(lives <= 0){ state = "over"; show("GAME OVER", `점수 ${score}<br><b>화면을 탭</b>하면 다시 시작 (PC는 스페이스)`); }
  else { state = "dead"; show("MISS", `남은 목숨 ${lives}`); setTimeout(()=>{ if(state==="dead"){ loadLevel(level); state="play"; hide(); } }, 900); }
  updHud();
}

function update(){
  if(state !== "play" || document.hidden) return;   // 창이 가려지면 자동 일시정지

  advance(player, SPD, playerDecide);
  if(grace > 0) grace--;
  else for(const e of enemies) advance(e, ESPD, enemyDecide);
  decayBuf();

  // 금괴
  const px = Math.round(player.x), py = Math.round(player.y);
  if(grid[py] && grid[py][px] === "$"){
    grid[py][px] = "."; goldLeft--; score += 250; updHud();
    if(goldLeft === 0){ escapeOpen = true; flash = 60; }
  }

  // 구멍 복구
  for(let i=holes.length-1;i>=0;i--){
    const h = holes[i];
    if(++h.t >= REGEN){
      grid[h.y][h.x] = "#";
      holes.splice(i,1);
      if(Math.round(player.x)===h.x && Math.round(player.y)===h.y) return die();
      for(let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if(Math.round(e.x)===h.x && Math.round(e.y)===h.y){
          enemies.splice(j,1); score += 400; updHud();
          enemies.push(spawnEnemy());
        }
      }
    }
  }

  // 충돌
  for(const e of enemies){
    if(e.hole > 0 || grace > 0) continue;
    if(Math.abs(e.x-player.x) < 0.62 && Math.abs(e.y-player.y) < 0.62) return die();
  }

  // 탈출
  if(escapeOpen && Math.round(player.y) === 0){
    score += 1500; updHud();
    state = "clear";
    show("LEVEL CLEAR", "다음 층으로…");
    setTimeout(()=>{ loadLevel(level+1); state="play"; hide(); }, 1100);
  }
  if(flash > 0) flash--;
}

// ---------- 그리기 ----------
function brick(x,y,a){
  const px = x*TS, py = y*TS;
  ctx.fillStyle = `rgba(150,78,52,${a})`; ctx.fillRect(px,py,TS,TS);
  ctx.fillStyle = `rgba(191,110,74,${a})`;
  ctx.fillRect(px+1,py+1,TS-2,TS/2-2);
  ctx.fillRect(px+1,py+TS/2+1,TS/2-2,TS/2-2);
  ctx.fillRect(px+TS/2+1,py+TS/2+1,TS/2-2,TS/2-2);
}
function ladder(x,y,bright){
  const px = x*TS, py = y*TS;
  ctx.strokeStyle = bright ? "#5fe08a" : "#2a6a45";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px+5,py); ctx.lineTo(px+5,py+TS);
  ctx.moveTo(px+TS-5,py); ctx.lineTo(px+TS-5,py+TS);
  ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(px+5,py+6); ctx.lineTo(px+TS-5,py+6);
  ctx.moveTo(px+5,py+17); ctx.lineTo(px+TS-5,py+17);
  ctx.stroke();
}
function man(e,color,accent){
  const px = e.x*TS, py = e.y*TS, cx = px+TS/2;
  const swing = Math.sin(e.anim*0.9) * 4;
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();                                   // 다리
  ctx.moveTo(cx,py+15); ctx.lineTo(cx-4+swing,py+TS-2);
  ctx.moveTo(cx,py+15); ctx.lineTo(cx+4-swing,py+TS-2);
  ctx.moveTo(cx,py+15); ctx.lineTo(cx,py+8);         // 몸통
  ctx.moveTo(cx-6,py+11+swing*0.4); ctx.lineTo(cx+6,py+11-swing*0.4); // 팔
  ctx.stroke();
  ctx.fillStyle = accent;                            // 머리
  ctx.beginPath(); ctx.arc(cx, py+6, 4.2, 0, 7); ctx.fill();
}
function draw(){
  ctx.fillStyle = "#0d1018"; ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const raw = grid[y][x], px = x*TS, py = y*TS;
    if(raw === "#") brick(x,y,1);
    else if(raw === "@"){
      ctx.fillStyle = "#39445e"; ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle = "#485573"; ctx.fillRect(px+2,py+2,TS-4,TS-4);
    }
    else if(raw === "H") ladder(x,y,true);
    else if(raw === "S") ladder(x,y,escapeOpen && (flash===0 || (flash>>2)&1));
    else if(raw === "-"){
      ctx.strokeStyle = "#8d7a4a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px,py+5); ctx.lineTo(px+TS,py+5); ctx.stroke();
    }
    else if(raw === "$"){
      ctx.fillStyle = "#ffd23f";
      ctx.beginPath(); ctx.ellipse(px+TS/2, py+TS/2+3, 7, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff2b0";
      ctx.beginPath(); ctx.ellipse(px+TS/2-2, py+TS/2+1, 2.2, 3, 0, 0, 7); ctx.fill();
    }
  }
  // 곧 메워질 구멍 표시
  for(const h of holes){
    const left = REGEN - h.t;
    if(left < 80 && ((left>>2)&1)) brick(h.x, h.y, 0.45);
  }
  for(const e of enemies) man(e, e.hole>0 ? "#7b4a5c" : "#ff5f6d", "#ffb3ba");
  man(player, "#ffd23f", "#fff6cc");
}

// ---------- 루프 ----------
// 로직은 setInterval(탭이 가려져도 진행), 그리기만 rAF
setInterval(update, 16.667);
function loop(){ draw(); requestAnimationFrame(loop); }

// ---------- 입력 ----------
const KM = {ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",
            a:"left",d:"right",w:"up",s:"down",A:"left",D:"right",W:"up",S:"down"};
addEventListener("keydown", ev=>{
  const k = KM[ev.key];
  if(k){ press(k); ev.preventDefault(); }
  if(ev.key==="z"||ev.key==="Z"||ev.key===",") dig(-1);
  if(ev.key==="x"||ev.key==="X"||ev.key===".") dig(1);
  if(ev.key==="r"||ev.key==="R") restartLevel();
  if(ev.key===" "){ ev.preventDefault(); if(state==="over") newGame(); }
});
addEventListener("keyup", ev=>{ const k=KM[ev.key]; if(k) keys[k]=false; });

// 길게 눌러도 선택·확대·컨텍스트 메뉴가 뜨지 않게
["contextmenu","selectstart","dragstart"].forEach(t=>
  document.getElementById("pad").addEventListener(t, ev=>ev.preventDefault()));
document.getElementById("pad").addEventListener("touchstart", ev=>ev.preventDefault(), {passive:false});

// 손가락 추적형 패드: 이벤트 target 이 아니라 좌표로 버튼을 찾는다.
// → 글자·테두리·살짝 빗나간 터치 전부 흡수되고, 누른 채 미끄러지면 그 키로 갈아탄다.
const pad = document.getElementById("pad");
const DIRK = {l:"left", r:"right", u:"up", d:"down"};
const fingers = new Map();                       // pointerId -> {k, btn}
const downIds = new Set();                       // 패드에서 시작한 포인터
function padHit(x,y){
  const el = document.elementFromPoint(x,y);
  const btn = el && el.closest ? el.closest("#pad button") : null;
  return btn ? {k:btn.dataset.k, btn} : null;
}
function fingerUp(id){
  const f = fingers.get(id); if(!f) return;
  f.btn.classList.remove("on");
  if(DIRK[f.k]) keys[DIRK[f.k]] = false;
  fingers.delete(id);
}
function fingerAt(id, hit){
  const f = fingers.get(id);
  if(f && f.k === hit.k) return;
  fingerUp(id);
  fingers.set(id, hit);
  hit.btn.classList.add("on");
  if(hit.k === "dl") dig(-1);
  else if(hit.k === "dr") dig(1);
  else press(DIRK[hit.k]);
}
pad.addEventListener("pointerdown", ev=>{
  ev.preventDefault();
  downIds.add(ev.pointerId);
  const hit = padHit(ev.clientX, ev.clientY);
  if(hit) fingerAt(ev.pointerId, hit);
});
pad.addEventListener("pointermove", ev=>{
  if(!downIds.has(ev.pointerId)) return;
  const hit = padHit(ev.clientX, ev.clientY);
  if(hit) fingerAt(ev.pointerId, hit);
});
["pointerup","pointercancel"].forEach(t=>pad.addEventListener(t, ev=>{
  downIds.delete(ev.pointerId); fingerUp(ev.pointerId);
}));
const clearKeys = ()=>{ keys.left=keys.right=keys.up=keys.down=false;
                        [...fingers.keys()].forEach(fingerUp); downIds.clear(); };
addEventListener("blur", clearKeys);

// 폰엔 스페이스가 없다 — 게임 화면(과 게임오버 안내)을 탭하면 다시 시작
const tapRestart = ev=>{ if(state==="over"){ ev.preventDefault(); newGame(); } };
cv.addEventListener("pointerdown", tapRestart);
document.getElementById("msg").addEventListener("pointerdown", tapRestart);

function restartLevel(){ if(state==="play"||state==="over"){ loadLevel(level); state="play"; hide(); } }
function newGame(){ lives=3; score=0; loadLevel(0); state="play"; hide(); updHud(); }

const $ = id=>document.getElementById(id);
function updHud(){ $("sc").textContent=score; $("lv").textContent=level+1; $("gd").textContent=goldLeft; $("li").textContent=lives; }
function show(t,p){ $("mt").innerHTML=t; $("mp").innerHTML=p; $("msg").style.display="flex"; }
function hide(){ $("msg").style.display="none"; }

$("vr").textContent = "v" + APP_VER;
loadLevel(0);
requestAnimationFrame(loop);

// ---------- 앱(PWA): 아이콘·매니페스트 런타임 생성 + 오프라인 캐시 ----------
function iconPNG(size){
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), u = size/24;                 // 24단위 그리드
  g.fillStyle = "#0d1018"; g.fillRect(0,0,size,size);
  g.fillStyle = "#a8532f";                                    // 벽돌 바닥
  g.fillRect(0, 17*u, size, 3*u);
  g.fillStyle = "#bf6e4a";
  for(let i=0;i<6;i++) g.fillRect((i*4+0.4)*u, 17.4*u, 3.2*u, 2.2*u);
  g.strokeStyle = "#5fe08a"; g.lineWidth = 1.1*u; g.lineCap = "butt";  // 사다리
  g.beginPath();
  g.moveTo(16.5*u,3*u); g.lineTo(16.5*u,20*u);
  g.moveTo(20.5*u,3*u); g.lineTo(20.5*u,20*u);
  for(let y=5;y<20;y+=3.6){ g.moveTo(16.5*u,y*u); g.lineTo(20.5*u,y*u); }
  g.stroke();
  g.fillStyle = "#ffd23f";                                    // 금괴
  g.beginPath(); g.ellipse(5*u,14*u,2.4*u,2.7*u,0,0,7); g.fill();
  g.strokeStyle = "#ffd23f"; g.lineWidth = 1.5*u; g.lineCap = "round"; // 러너
  g.beginPath();
  g.moveTo(10*u,10.5*u); g.lineTo(10*u,14*u);
  g.moveTo(10*u,14*u); g.lineTo(8*u,17*u);
  g.moveTo(10*u,14*u); g.lineTo(12.4*u,17*u);
  g.moveTo(7.6*u,11.6*u); g.lineTo(12.4*u,11*u);
  g.stroke();
  g.fillStyle = "#fff6cc";
  g.beginPath(); g.arc(10*u, 8.2*u, 2*u, 0, 7); g.fill();
  return c.toDataURL("image/png");
}
(function installMeta(){
  const i180 = iconPNG(180), i512 = iconPNG(512);
  const link = (rel, href, extra) => {
    const l = document.createElement("link"); l.rel = rel; l.href = href;
    if(extra) Object.assign(l, extra); document.head.appendChild(l);
  };
  link("apple-touch-icon", i180);
  link("icon", iconPNG(64));
  const mf = {
    name:"로드러너 · LODE RUNNER", short_name:"로드러너", start_url:".", scope:".",
    display:"fullscreen", orientation:"landscape", background_color:"#0a0c14", theme_color:"#0a0c14",
    icons:[{src:i180,sizes:"180x180",type:"image/png"},
           {src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]
  };
  link("manifest", URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"})));
  if(location.protocol.startsWith("http") && navigator.serviceWorker)
    // updateViaCache:"none" — 워커 스크립트는 절대 브라우저 캐시에서 읽지 않는다
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(()=>{});
})();

// ---------- 자동 업데이트: 서버 버전이 다르면 한 번만 새로고침 ----------
// 서비스워커·브라우저 캐시가 옛 파일을 붙잡고 있어도 이걸로 풀린다.
let lastCheck = 0;
async function checkFresh(){
  if(!location.protocol.startsWith("http")) return;      // file:// 은 확인할 서버가 없다
  const now = Date.now();
  if(now - lastCheck < 30000) return;                     // 30초 스로틀
  lastCheck = now;
  try{                                                    // 워커 갱신 확인은 게임 중에도 돌린다
    const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
    await Promise.all(regs.map(r=>r.update().catch(()=>{})));
  }catch(_){}
  if(state === "play" && score > 0) return;               // 화면 새로고침만 게임 중엔 미룬다
  try{
    const txt = await (await fetch(location.pathname + "?fresh=" + now, {cache:"no-store"})).text();
    const m = txt.match(/APP_VER\s*=\s*"([^"]+)"/);
    if(!m || m[1] === APP_VER) return;
    try{ if(sessionStorage.getItem("lr_reloaded") === m[1]) return;   // 새로고침 루프 방지
         sessionStorage.setItem("lr_reloaded", m[1]); }catch(_){}
    location.replace(location.pathname + "?u=" + now);
  }catch(_){}
}
addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkFresh(); });
addEventListener("pageshow", checkFresh);
checkFresh();
</script>
